name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

# AGP 8.5.2 (app/build.gradle.kts's `com.android.application` version) needs
# Gradle 8.7+ and JDK 17 - both pinned explicitly below rather than left to
# whatever the runner image happens to default to.
env:
  GRADLE_VERSION: "8.7"
  COMPILE_SDK: "34"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # Installs cmdline-tools, accepts licenses, and exports ANDROID_HOME /
        # ANDROID_SDK_ROOT for the steps below.

      - name: Install platform + build-tools
        run: |
          sdkmanager --install \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${COMPILE_SDK}.0.0"

      # No gradlew is committed to this repo (see README note in this file's
      # PR / commit message) - setup-gradle provisions a matching Gradle
      # directly and caches it, so `gradle` below just works without one.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: umlinux-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
